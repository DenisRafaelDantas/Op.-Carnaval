<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Admin • PMs - Operação Carnaval</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />


  <link rel="stylesheet" href="../css/estilos.css" />
</head>

<body class="layout-pagina">
  <main class="container py-4">

    <!-- Cabeçalho interno com brasões nos cantos -->
    <header class="cabecalho-interno">
      <img src="../img/pmesp.png" class="brasao brasao-pmesp" alt="PMESP">
      <div class="text-center">
        <h1 class="h5 mb-1 text-light fw-bold">4º BPM/M</h1>
        <h1 class="h6 mb-1 text-light">Cel PM Luiz Nakaharada</h1>
      </div>
      <img src="../img/4bpmm.png" class="brasao brasao-4bpmm" alt="4º BPM/M">
    </header>

    <!-- Card do painel -->
    <div class="d-flex justify-content-center pt-4">
      <section class="card card-sombra conteudo-largura-estreita">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between">
            <h1 class="h5 mb-1">PMs</h1>
            <a class="btn btn-secondary" href="principal.html">
              Voltar
            </a>            
          </div>

          <p class="text-body-secondary mb-3">
              Lista de PMs cadastrados. Você pode cadastrar e editar.
            </p>

          <div id="listaPms" class="lista-rolavel"></div>

          <div id="semPms" class="text-body-secondary small d-none mt-3">
            Nenhum PM cadastrado ainda.
          </div>

          <div class="d-flex justify-content-between mt-3">
            <a class="btn btn-primary" href="cadastro-pm.html">
              Cadastrar PM
            </a>

            <a class="btn btn-outline-success" href="pms-importar-planilha.html" title="Atualizar banco via planilha">
              <i class="bi bi-file-earmark-spreadsheet"></i>
              <span class="ms-1 d-none d-sm-inline">Planilha</span>
            </a>
          </div>

        </div>
      </section>
    </div>
  </main>

  <footer class="rodape-institucional">
    <div class="container text-center">
      <div class="small text-body-secondary">
        PMESP • 4º BPM/M • 2026
      </div>
      <div class="small text-body-secondary">
        Desenvolvido por: Sd PM 153602-8 Reis
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script src="js/ordenacao.js"></script>
  <script type="module" src="js/pms.js"></script>
  <script src="js/uppercase.js"></script>
  <script type="module" src="../js/guard-admin.js"></script>
</body>

</html>
