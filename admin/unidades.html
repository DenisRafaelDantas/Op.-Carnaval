<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Admin • Unidades - Operação Carnaval</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="../css/estilos.css" />

<body class="layout-pagina">
  <main class="container py-4">

    <!-- Cabeçalho interno com brasões nos cantos -->
    <header class="cabecalho-interno">
      <img src="../img/pmesp.png" class="brasao brasao-pmesp" alt="PMESP">
      <img src="../img/4bpmm.png" class="brasao brasao-4bpmm" alt="4º BPM/M">
    </header>

    <!-- Card do painel -->
    <div class="d-flex justify-content-center pt-4">

        <div class="card-body p-4">

          <div class="d-flex justify-content-between">
          <h1 class="h5 mb-1">Unidades</h1>
          <a class="btn btn-secondary" href="principal.html">
            Voltar
          </a>
          </div>

          <p class="text-body-secondary mb-3">
            Lista de unidades cadastradas. Você pode cadastrar e editar.
          </p>

          <div id="listaUnidades" class="lista-rolavel"></div>

          <div id="semUnidades" class="text-body-secondary small d-none mt-3">

          <div class="d-flex gap-2 mt-3">

            <a class="btn btn-primary" href="cadastro-unidade.html">
              Cadastrar Unidade

          </div>

        </div>
      </section>
    </div>

  <footer class="rodape-institucional">
    <div class="container text-center">
      <div class="small text-body-secondary">
        PMESP • 4º BPM/M • 2026
      </div>
      <div class="small text-body-secondary">
        Desenvolvido por: Sd PM 153602-8 Reis

    </div>
