<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Admin • Atualizar Patrulhas por Planilha - Operação Carnaval</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="../css/estilos.css" />
</head>

<body>
  <main class="container py-4">
    <div class="mx-auto conteudo-largura">

      <!-- Cabeçalho -->
      <header class="cabecalho-interno">
        <img src="../img/pmesp.png" class="brasao brasao-pmesp" alt="PMESP">
        <img src="../img/4bpmm.png" class="brasao brasao-4bpmm" alt="4º BPM/M">
      </header>

      <!-- Card principal -->
      <section class="card shadow-sm">
        <div class="card-body p-4">

          <div class="d-flex align-items-start justify-content-between gap-2 mb-3">
            <div>
              <h1 class="h5 mb-1">Atualizar Patrulhas por Planilha</h1>
              <p class="text-body-secondary mb-0">
                Selecione a planilha (Excel), escolha a data e clique em atualizar.
              </p>
            </div>

            <a class="btn btn-secondary btn-sm" href="patrulhas.html">
              Voltar
            </a>
          </div>

          <!-- Form -->
          <div class="border rounded p-3">
            <div class="row g-3">
              <div class="col-12">
                <label for="arquivoPlanilha" class="form-label">Planilha (.xlsx)</label>
                <input class="form-control" type="file" id="arquivoPlanilha" accept=".xlsx,.xls" />
                <div class="form-text">
                  A planilha precisa ter as colunas: <strong>RE</strong>, <strong>Observação</strong> e <strong>GP</strong>.
                </div>
              </div>

              <div class="col-12 col-md-6">
                <label for="dataAtualizacao" class="form-label">Data das patrulhas (do banco)</label>
                <input class="form-control" type="date" id="dataAtualizacao" />
                <div class="form-text">
                  A atualização vai procurar patrulhas cadastradas exatamente nesta data.
                </div>
              </div>

              <div class="col-12 col-md-6 d-flex align-items-end gap-2">
                <button class="btn btn-primary w-100" id="btnAtualizar" type="button">
                  Atualizar
                </button>
                <button class="btn btn-outline-secondary w-100" id="btnLimpar" type="button">
                  Limpar
                </button>
              </div>
            </div>
          </div>

          <!-- Status -->
          <div class="mt-3" id="statusArea">
            <div class="text-body-secondary small" id="statusTexto">
              Selecione a planilha e a data para começar.
            </div>
          </div>

          <!-- Log -->
          <div class="mt-3">
            <label class="form-label">Relatório</label>
            <pre class="border rounded p-3 bg-light small mb-0" id="log" style="min-height: 180px; white-space: pre-wrap;"></pre>
          </div>

        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- ✅ Leitura de Excel no navegador -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- JS -->
  <script type="module" src="js/atualizar-patrulhas.js"></script>
  <script type="module" src="../js/guard-admin.js"></script>
</body>

</html>
